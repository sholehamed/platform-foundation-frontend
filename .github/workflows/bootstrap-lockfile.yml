name: Bootstrap pnpm lockfile

on:
  push:
    branches: [feat/f01-angular-22-foundation]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit resolved dependency lockfile
        run: |
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(deps): lock exact pnpm dependency graph"
            git push origin HEAD:feat/f01-angular-22-foundation
          fi
